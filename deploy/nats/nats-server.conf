server_name: agent-bus-odin
port: 4222
http: 8222
max_payload: 1MB

jetstream {
  store_dir: /data/jetstream
  max_mem_store: 256MB
  max_file_store: 10GB
}

tls {
  cert_file: /etc/nats/tls/server.crt
  key_file: /etc/nats/tls/server.key
  ca_file: /etc/nats/tls/ca.crt
  verify: false
  timeout: 2
}

# Generated on the host with a bcrypt password hash. Never commit this file.
include /etc/nats/auth.conf

